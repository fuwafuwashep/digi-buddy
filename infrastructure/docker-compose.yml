name: digibuddy-local

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digibuddy_dev}
      POSTGRES_USER: ${POSTGRES_USER:-digibuddy_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digibuddy_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: flyway/flyway:11.8.2
    profiles: ["migration"]
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-digibuddy_dev}
      - -user=${POSTGRES_USER:-digibuddy_dev}
      - -password=${POSTGRES_PASSWORD:-digibuddy_local_only}
      - -connectRetries=60
      - migrate
    volumes:
      - ../backend/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
