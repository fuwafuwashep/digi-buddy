ktor {
    application {
        modules = [ com.digibuddy.backend.ApplicationKt.configuredModule ]
    }
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }
}

digibuddy {
    environment = "local-development"
    environment = ${?DIGIBUDDY_ENVIRONMENT}

    allowDevelopmentHelperApproval = false
    allowDevelopmentHelperApproval = ${?ALLOW_DEVELOPMENT_HELPER_APPROVAL}

    helperApprovalToken = ${?HELPER_APPROVAL_TOKEN}

    authentication {
        repository = "memory"
        repository = ${?AUTH_REPOSITORY}
        otpProvider = "development"
        otpProvider = ${?AUTH_OTP_PROVIDER}
        tokenPepper = "local-development-token-pepper-change-me"
        tokenPepper = ${?AUTH_TOKEN_PEPPER}
        identifierKey = "local-development-identifier-key-change-me"
        identifierKey = ${?AUTH_IDENTIFIER_KEY}
        twilioVerifyServiceSid = ${?TWILIO_VERIFY_SERVICE_SID}
    }

    database {
        jdbcUrl = "jdbc:postgresql://localhost:5432/digibuddy_dev"
        jdbcUrl = ${?DATABASE_JDBC_URL}
        username = "digibuddy_dev"
        username = ${?POSTGRES_USER}
        password = ${?POSTGRES_PASSWORD}
    }

    redisUrl = "redis://localhost:6379"
    redisUrl = ${?REDIS_URL}

    developmentAdapters {
        twilioAccountSid = ${?TWILIO_ACCOUNT_SID}
        twilioAuthToken = ${?TWILIO_AUTH_TOKEN}
        stripeSecretKey = ${?STRIPE_SECRET_KEY}
        apnsKeyId = ${?APNS_KEY_ID}
        apnsTeamId = ${?APNS_TEAM_ID}
        apnsPrivateKeyPath = ${?APNS_PRIVATE_KEY_PATH}
        s3Endpoint = ${?S3_ENDPOINT}
        s3AccessKeyId = ${?S3_ACCESS_KEY_ID}
        s3SecretAccessKey = ${?S3_SECRET_ACCESS_KEY}
    }
}
